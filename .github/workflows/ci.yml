name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shader:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select the metallib toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Detect shader drift
        run: |
          tmp="$(mktemp -d)/default.metallib"
          xcrun -sdk macosx metal -mmacos-version-min=14.0 \
            Sources/MoongladeApp/Ripple.metal -o "$tmp"
          cmp "$tmp" Sources/MoongladeApp/Resources/default.metallib
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift run moonglade-tests
      - name: Test OpenCode plugin
        run: node Tests/OpenCodePlugin/moonglade_test.mjs
      - name: Validate resources
        run: |
          plutil -lint config/Info.plist
          for script in scripts/*.sh Sources/MoongladeCore/Resources/hooks/*.sh; do /bin/sh -n "$script"; done
          node --input-type=module --check < Sources/MoongladeCore/Resources/opencode/moonglade.js
      - name: Package local app
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict .build/Moonglade.app
           test -x .build/Moonglade.app/Contents/MacOS/Moonglade
           test -x .build/Moonglade.app/Contents/Resources/bin/moonglade
           test -f .build/Moonglade.app/Contents/Resources/Moonglade_MoongladeApp.bundle/default.metallib
