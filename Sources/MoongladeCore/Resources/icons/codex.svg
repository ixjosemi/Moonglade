<svg role="img" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Codex</title>
  <!-- App-tile treatment shared with Goatty: the brand mark in a pale tint on a
       squircle of the brand colour, lit from above. No filter primitives, so
       AppKit, librsvg and browsers draw it identically. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52A7D0"/>
      <stop offset="1" stop-color="#4495BF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="2110">
      <stop offset="0" stop-color="#F4F8FB"/>
      <stop offset="1" stop-color="#C6DAE5"/>
    </linearGradient>
    <path id="knot" d="M1107.3 299.1c-197.999 0-373.9 127.3-435.2 315.3L650 743.5v427.9c0 21.4 11 40.4 29.4 51.4l344.5 198.515V833.3h.1v-27.9L1372.7 604c33.715-19.52 70.44-32.857 108.47-39.828L1447.6 450.3C1361 353.5 1237.1 298.5 1107.3 299.1zm0 117.5-.6.6c79.699 0 156.3 27.5 217.6 78.4-2.5 1.2-7.4 4.3-11 6.1L952.8 709.3c-18.4 10.4-29.4 30-29.4 51.4V1248l-155.1-89.4V755.8c-.1-187.099 151.601-338.9 339-339.2z"/>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7.2" fill="url(#tile)"/>
  <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="6.8" fill="none" stroke="url(#rim)" stroke-width=".8"/>
  <g transform="translate(16 16) scale(.0088) translate(-1203 -1203)">
    <g fill="#0F3F5C" fill-opacity=".28" transform="translate(0 68)">
      <use xlink:href="#knot"/>
      <use xlink:href="#knot" transform="rotate(60 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(120 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(180 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(240 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(300 1203 1203)"/>
    </g>
    <g fill="url(#ink)">
      <use xlink:href="#knot"/>
      <use xlink:href="#knot" transform="rotate(60 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(120 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(180 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(240 1203 1203)"/>
      <use xlink:href="#knot" transform="rotate(300 1203 1203)"/>
    </g>
  </g>
</svg>
